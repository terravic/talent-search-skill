[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-search-skill"
version = "1.0.0"
description = "Executive Talent Intelligence and Sourcing Skill & Plugin for Gemini Enterprise and Agentic Systems."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Talent Intelligence Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.scripts]
talent-search = "scripts.talent_search:main"
talent-validate = "scripts.validate_output:main"
talent-prompts = "scripts.generate_prompts:main"
